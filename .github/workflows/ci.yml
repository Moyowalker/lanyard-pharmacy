name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-validation:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web Typecheck
            command: pnpm --filter @lanyard/web typecheck
            generate_prisma: false
          - name: Admin Typecheck
            command: pnpm --filter @lanyard/admin typecheck
            generate_prisma: false
          - name: API Build
            command: pnpm --filter @lanyard/api build
            generate_prisma: true
          - name: Worker Build
            command: pnpm --filter @lanyard/worker build
            generate_prisma: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: matrix.generate_prisma
        run: pnpm --filter @lanyard/api db:generate

      - name: Run workspace validation
        run: ${{ matrix.command }}

  runtime-validation:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API E2E
            command: pnpm --filter @lanyard/api test:e2e
          - name: Worker E2E
            command: pnpm --filter @lanyard/worker test:e2e
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lanyard_pharmacy?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lanyard_pharmacy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lanyard_pharmacy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @lanyard/api db:generate

      - name: Apply database migrations
        run: pnpm --filter @lanyard/api db:deploy

      - name: Run runtime validation
        run: ${{ matrix.command }}